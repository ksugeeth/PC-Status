<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bench Timer System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="bench" id="civicBench">
            CIVIC Bench
            <select id="civicTimer">
                <option value="30">30 Minutes</option>
                <option value="60">60 Minutes</option>
                <option value="120">120 Minutes</option>
            </select>
            <span id="civicCountdown">00:00</span>
        </div>

        <div class="bench" id="doctorsBench">
            Doctor's Bench
            <select id="doctorsTimer">
                <option value="30">30 Minutes</option>
                <option value="60">60 Minutes</option>
                <option value="120">120 Minutes</option>
            </select>
            <span id="doctorsCountdown">00:00</span>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
