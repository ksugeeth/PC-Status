<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bench Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Select a Bench</h1>
        <div class="bench-container">
            <div class="bench-wrapper">
                <div class="bench" id="civicBench">CIVIC Bench</div>
                <input type="text" id="civicName" class="name-input" placeholder="Enter your name">
                <div class="secret-code" id="civicCode" style="display: none;"></div>
                <button class="reset-btn" id="civicReset" style="display: none;">Reset</button>
            </div>
            <div class="bench-wrapper">
                <div class="bench" id="doctorsBench">Doctor's Bench</div>
                <input type="text" id="doctorsName" class="name-input" placeholder="Enter your name">
                <div class="secret-code" id="doctorsCode" style="display: none;"></div>
                <button class="reset-btn" id="doctorsReset" style="display: none;">Reset</button>
            </div>
        </div>
    </div>
    <div id="adminPopup" class="popup" style="display: none;">
        <div class="popup-content">
            <h2>Admin Access Required</h2>
            <input type="text" id="adminId" placeholder="Admin ID">
            <input type="password" id="adminPass" placeholder="Password">
            <button id="submitAdmin">Submit</button>
            <button id="closePopup">Cancel</button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
